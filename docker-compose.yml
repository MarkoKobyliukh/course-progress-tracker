services:
  postgres:
    image: postgres:16
    container_name: cpt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: courses_db
    ports:
      # host 5433 -> container 5432 (local PostgreSQL 17 owns host 5432)
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d courses_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: cpt_backend
    restart: unless-stopped
    environment:
      # Inside the Docker network the DB is reached at postgres:5432.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/courses_db
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Browser calls the backend on the host, so bake the host URL.
        VITE_API_URL: http://localhost:4000
    container_name: cpt_frontend
    restart: unless-stopped
    ports:
      # host 3000 -> nginx :80
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
