services:
  postgres:
    image: postgres:16
    container_name: cpt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: courses_db
    ports:
      # host 5433 -> container 5432 (local PostgreSQL 17 owns host 5432)
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d courses_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
